# Hexo 站点配置
# 配置说明：https://hexo.io/zh-cn/docs/configuration
# 站点许可见 LICENSE；主题配置与许可见 themes/dragonfly。

# 站点信息
# ────────────────────────────────
title: 猫说 Meow
subtitle: ''
description: I am LynxCatTheThird, an AGI from the 103rd century.
keywords: null
author: LynxCatTheThird
language: zh-CN
timezone: Asia/Shanghai
# 主题选项写入 _config.dragonfly.yml。
theme: dragonfly

# 地址与路由
# ────────────────────────────────
# 填写站点的完整公开地址；子路径部署时同步配置 root。
url: https://www.lynx3.me/
# 文章路径模板；现有链接格式会影响外部引用。
permalink: article/:abbrlink/
permalink_defaults: null

# 控制链接末尾的 index.html 和 .html。
pretty_urls:
  trailing_index: true
  trailing_html: true

# 内容目录
# ────────────────────────────────
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang

# 直接复制到输出目录的文件模式。
skip_render: null
# 相对于 source 目录的额外收录规则。
include: null
# 相对于 source 目录的排除规则。
exclude: null
# 构建时忽略的文件模式。
ignore:
  - '**/push.sh'

# 文章与渲染
# ────────────────────────────────
# 新文章文件名模板。
new_post_name: :title.md
default_layout: post
titlecase: false

# 外部链接的打开方式与作用范围。
external_link:
  enable: true
  field: site
  exclude: ''

filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

# 代码高亮引擎，与主题代码块外观分开配置。
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: true
  tab_replace: ''
  wrap: true
  hljs: false

prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# 首页与归档
# ────────────────────────────────
# 首页路径、每页文章数与排序。
index_generator:
  path: ''
  per_page: 10
  order_by: -date

default_category: uncategorized
category_map: null
tag_map: null

date_format: YYYY-MM-DD
time_format: HH:mm:ss
# 更新时间来源：mtime / date / empty。
updated_option: mtime

# 分页大小，0 表示不分页。
per_page: 10
pagination_dir: page

# 链接与搜索
# ────────────────────────────────
# 文章短链接插件，保留既有 ID 可避免旧地址失效。
abbrlink:
  alg: crc32
  rep: hex
  drafts: false
  auto_category:
    enable: true
    depth: null
    over_write: false
  auto_title: false
  auto_date: false
  force: false

nofollow:
  enable: true
  field: site
  exclude: null

# 本地搜索索引的输出路径与收录范围。
search:
  path: search.xml
  field: post
  content: true
  format: html

# 内容分发与优化
# ────────────────────────────────
meta_generator: true

sitemap:
  path:
    - sitemap.xml
    - sitemap.txt
  rel: true
  tags: true
  categories: true

feed:
  type:
    - atom
    - rss2
  path:
    - atom.xml
    - rss2.xml
  limit: 0
  content: true
  order_by: -date
  icon: favicon.ico
  autodiscovery: true

# 按文件类型设置输出压缩。
minify:
  enable: true
  previewServer: true
  html:
    enable: true
    exclude: null
  css:
    enable: true
    exclude: null
  js:
    enable: true
    exclude:
      - '*.min.js'
  svg:
    enable: true
    include:
      - '*.svg'
  gzip:
    enable: false
  brotli:
    enable: false
  xml:
    enable: false
    include:
      - '*.xml'
  json:
    enable: true
    include:
      - '*.json'
  zstd:
    enable: false

# hexo-blog-encrypt 的站点级默认设置。
encrypt:
  abstract: 文章被加密了, 请输入密码查看。
  message: 您好, 这里需要密码。
  wrong_pass_message: 抱歉, 这个密码看着不太对, 请再试试。
  theme: xray
  silent: true
  kdf:
    iterations: 600000

# 部署
# ────────────────────────────────
# 部署插件与目标配置。
deploy:
  - type: git
    repository: git@github.com:LynxCatTheThird/lynxcatthethird.github.io.git
    branch: main
