# SPDX-License-Identifier: Apache-2.0
# Dragonfly 项目修改；来源与署名见主题 NOTICE。
# 配置指南：主题目录中的 docs/configuration.md
# 示例配置行可取消注释，保留缩进；分组标题和说明保持注释。

# 站点标识与菜单
# ────────────────────────────────

# 站点图标；主题内置 SVG 与 ICO。
favicon: /favicon.ico

# 头像及悬停旋转效果。
avatar:
  img: https://s2.hdslb.com/bfs/face/55653dbd3d6e3d685896bcd10242aa9585d28f56.jpg@1e_0c.webp
  effect: false

nav:
  # 导航栏标志图片。
  logo: null
  # 显示站点标题；标题文本来自站点配置的 title。
  display_title: true
  # 滚动文章时在导航栏显示当前文章标题。
  display_post_title: true
  # 固定导航栏。
  fixed: false

# 格式：名称: 路径 || Font Awesome 图标；子菜单可使用嵌套对象。
menu:
  主页: / || fas fa-home
  时间线: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  交流||fas fa-list:
    友链: /link/ || fas fa-link
    留言板: /comment/ || fas fa-share-nodes
  关于||fas fa-list:
    关于我: /about/ || fas fa-user
    条款与政策: /policy/ || fas fa-envelope-open-text
    AI 标识说明: /policy/ai/ || fas fa-carrot

# 格式：图标: 链接 || 描述 || 颜色。
social:
  fab fa-github: https://github.com/LynxCatTheThird/ || GitHub || '#24292e'
  fab fa-twitter: https://twitter.com/LynxCatTheThird/ || Twitter || '#1da1f2'
  fab fa-telegram: https://t.me/LynxCatTheThird/ || Telegram || '#2ca5e0'
  fas fa-rss: /rss2.xml || RSS || '#f26522'

# 外观与布局
# ────────────────────────────────

# 初始配色：light / dark。
display_mode: light

darkmode:
  # 启用深色模式及相关样式切换。
  enable: true
  # 在右侧工具栏显示手动切换按钮。
  button: true
  # 1 跟随系统偏好（无结果时按时间）；2 按进入页面时的本地时间；false 关闭自动判断。
  autoChangeMode: 1
  # 日间开始小时，留空按 6 处理；当前实现中 0 也使用默认值。
  start: null
  # 日间结束小时，留空按 18 处理；手动选择的配色优先于自动判断。
  end: null

# 自定义主题配色：需要时取消下列整个配置块的注释；颜色值保留引号。
# theme_color:
#   enable: true
#   main: '#49b1f5'
#   paginator: '#00c4b6'
#   button_hover: '#ff7242'
#   text_selection: '#00c4b6'
#   link_color: '#99a9bf'
#   meta_color: '#858585'
#   hr_color: '#a4d8fa'
#   code_foreground: '#f47466'
#   code_background: 'rgba(27, 31, 35, .05)'
#   toc_color: '#00c4b6'
#   blockquote_padding_color: '#49b1f5'
#   blockquote_background_color: '#49b1f5'
#   scrollbar_color: '#49b1f5'
#   meta_theme_color_light: '#ffffff'
#   meta_theme_color_dark: '#0d0d0d'

# 支持颜色、图片地址或数组；数组每次随机选择一项。
background:
  # - '#f5f7fa'
  # - /img/background.jpg

# 字号可带 px、rem 等单位；字体名称按 CSS font-family 语法填写。
font:
  # 正文基准字号，如 14px；留空使用 14px。
  global_font_size: 16px
  # 代码字号，如 13px；留空跟随正文基准字号。
  code_font_size: null
  # 正文 font-family 列表；字体资源需另行加载。
  font_family: "'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"
  # 代码 font-family 列表，建议包含等宽字体。
  code_font_family: "'JetBrains Mono', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"

# 标题专用字体及其样式表地址。
blog_title_font:
  # 标题字体的 CSS 地址，由主题加载；font_family 填写其中声明的字体名。
  font_link: null
  font_family: null

# 使用圆角卡片与按钮。
rounded_corners_ui: true

# 正文两端对齐。
text_align_justify: false

# 为页头、页脚背景添加遮罩，改善文字对比度。
mask:
  header: true
  footer: true

# 分隔线图标：使用 Font Awesome 的 Unicode 编码。
hr_icon:
  enable: true
  icon: null
  # 分隔线图标的垂直偏移，如 -10px。
  icon_top: null

# 侧栏位置、显示范围与卡片。
aside:
  enable: true
  # 默认收起侧栏，可由工具栏按钮切换。
  hide: false
  # 显示侧栏开关按钮，需同时启用 aside.enable。
  button: true
  # 在窄屏显示侧栏内容。
  mobile: true
  # 侧栏位置：left / right。
  position: right
  # 分别控制归档、标签和分类详情页的侧栏。
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: null
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me!
      link: https://github.com/LynxCatTheThird
  card_announcement:
    enable: true
    content: 喵喵喵喵~
  card_recent_post:
    enable: true
    # 0 表示显示全部文章。
    limit: 5
    # 最近文章的排序字段：date / updated。
    sort: date
    # 保留字段；当前卡片顺序由模板决定。
    sort_order: null
  card_newest_comments:
    enable: false
    # 保留字段；当前卡片顺序由模板决定。
    sort_order: null
    limit: 6
    # 评论缓存时长，单位：分钟。
    storage: 10
    avatar: true
  card_categories:
    enable: true
    # 分类条目上限，含子分类；0 显示全部。
    limit: 8
    # none 展示完整层级；true 默认展开可折叠分组；false 默认折叠。
    expand: false
    # 保留字段；当前卡片顺序由模板决定。
    sort_order: null
  card_tags:
    enable: true
    # 显示的标签数量，0 显示全部。
    limit: 40
    # 启用彩色标签；custom_colors 可指定单色或颜色数组。
    color: false
    custom_colors:
      # - '#49b1f5'
      # - '#00c4b6'
    # 标签排序：random / name / length。
    orderby: random
    # 1 升序，-1 降序。
    order: 1
    # 保留字段；当前卡片顺序由模板决定。
    sort_order: null
  card_archives:
    enable: true
    # 归档粒度：monthly / yearly。
    type: monthly
    # 归档日期格式，如 YYYY年MM月。
    format: YYYY 年 MM 月
    order: -1
    # 归档条目上限，0 显示全部。
    limit: 8
    # 保留字段；当前卡片顺序由模板决定。
    sort_order: null
  card_post_series:
    enable: true
    series_title: false
    # 系列排序字段：title / date。
    orderBy: date
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    # 保留字段；当前卡片顺序由模板决定。
    sort_order: null
    # 站点运行起始日期，如 2026-01-01；留空隐藏运行时长。
    runtime_date: null

# 页脚导航、站点署名与主题信息。
footer:
  # 页脚分组列表，结构与示例见 docs/configuration.md。
  nav:
    # - width: 1
    #   content:
    #     - title: 内容
    #       item:
    #         - title: 归档
    #           url: /archives/
  owner:
    enable: true
    # 站点起始年份。
    since: 2020
  # 主题与 Hexo 的署名及版本显示。
  copyright:
    enable: true
    version: true
  # 追加到页脚的 HTML。
  custom_text: <a href="https://icp.gov.moe/?keyword=20231970">萌 ICP 备 20231970 号</a>

# 右侧工具栏距底部的距离，如 20px。
rightside_bottom: null

# 在回到顶部按钮中显示阅读进度。
rightside_scroll_percent: true

# 工具栏排序；hide 与 show 使用逗号分隔名称，项目不重复。
rightside_item_order:
  enable: true
  # 折叠组：readmode、darkmode、hideAside；留空沿用默认顺序。
  hide: readmode,darkmode,hideAside
  # 常显组：toc、comment；留空沿用默认顺序。
  show: toc,comment

# 右侧设置按钮的旋转动效。
rightside_config_animation: true

# 封面与图片
# ────────────────────────────────

# 关闭页面顶部封面。
disable_top_img: false

# 页面未指定封面时使用的图片。
default_top_img: https://s2.hdslb.com/bfs/openplatform/6e7138fb1c7c8fd8262689d4f145ca070bb0eae4.png@1e_0c.webp

# 首页顶部封面；留空继承 default_top_img，false 隐藏该封面区域。
index_img: https://s2.hdslb.com/bfs/openplatform/2c9190995d75dccaf40b60aa51fe0a6c240431a6.png@1e_0c.webp

# 归档页顶部封面；留空继承 default_top_img，false 隐藏。
archive_img: null

# 标签详情页的默认封面。
tag_img: null

# 标签名到图片地址的映射，优先于 tag_img。
tag_per_img:
  # 笔记: /img/tags/notes.jpg

# 分类详情页的默认封面。
category_img: null

# 分类名到图片地址的映射，优先于 category_img。
category_per_img:
  # 技术: /img/categories/tech.jpg

# 页脚背景图片；false 使用默认背景。
footer_img: linear-gradient(to right, rgb(0, 180, 219), rgb(0, 131, 176));

cover:
  # 在首页文章卡片显示封面。
  index_enable: true
  # 在侧栏文章卡片显示封面。
  aside_enable: true
  # 在归档列表显示封面。
  archives_enable: true
  # 文章未设置 cover 时使用的封面列表。
  default_cover:
    # - /img/cover-1.jpg
    # - /img/cover-2.jpg

# 图片加载失败时的替代图。
error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

# 内置 404 页的提示与背景。
error_404:
  enable: true
  subtitle: Page Not Found
  background: https://s2.hdslb.com/bfs/article/a59ff0700a2c75cbec29af244d3068f91352440272.png@1e_0c.webp

# 正文图片的图注优先取 title，其次取 alt。
photofigcaption: false

# 普通文章图默认保留真实地址并使用浏览器原生懒加载。
lazyload:
  enable: true
  # false 切换到 vanilla-lazyload。loading=eager 或 fetchpriority=high 保留关键图片。
  native: true
  # 作用范围：post / site。
  field: post
  # 旧插件模式的占位图。
  placeholder: null
  # 旧插件占位图的模糊效果。
  blur: false

# 图片查看器：fancybox / medium_zoom；留空关闭。
lightbox: fancybox

# 传给所选图片查看器的参数。
lightbox_options: {}

# 首页与归档
# ────────────────────────────────

# 首页标题区域的位置，如 30% 或 300px。
index_site_info_top: null

# 首页封面高度，如 100vh 或 400px。
index_top_img_height: null

# 1 左图，2 右图，3 交替，4 上图，5 文字叠图，6 上图瀑布流，7 叠图瀑布流。
index_layout: 3

index_post_content:
  # 摘要来源：1 description，2 优先 description，3 自动摘要，false 关闭。
  method: 2
  # 自动摘要的字符数。
  length: 500

subtitle:
  enable: false
  # 使用 typed.js 打字动画；关闭时显示第一条可用副标题。
  effect: true
  # 传给 typed.js 的参数对象。
  typed_option:
    # typeSpeed: 150
    # backSpeed: 50
  # 第三方副标题：1 一言，2 aa1.cn，3 今日诗词，false 使用 sub。
  source: false
  # 自定义副标题列表。关闭打字效果时显示第一项。
  sub:
    # - 记录与分享
    # - 欢迎阅读

# 分类页样式：index 使用首页布局，留空使用归档布局。
category_ui: null

# 标签页样式：index 使用首页布局，留空使用归档布局。
tag_ui: null

# 文章阅读
# ────────────────────────────────

post_meta:
  # 首页文章卡片的元信息。
  page:
    # 日期：created / updated / both。
    date_type: created
    # 格式：date / relative。
    date_format: date
    categories: true
    tags: true
    label: true
  # 文章页顶部的元信息。
  post:
    # 文章元信息对齐方式：left / center。
    position: left
    # 日期：created / updated / both。
    date_type: both
    # 格式：date / relative。
    date_format: date
    categories: true
    tags: true
    label: true

# 文章与独立页面的目录开关、层级和阅读进度。
toc:
  post: true
  page: true
  # 显示目录编号，可由文章 toc_number 覆盖。
  number: true
  # 默认展开目录层级，可由文章 toc_expand 覆盖。
  expand: true
  # 文章页侧栏采用简化目录布局，可由 toc_style_simple 覆盖。
  style_simple: false
  scroll_percent: true

# 显示阅读模式入口，临时隐藏正文以外的界面。
readmode: true

# 标题锚点与地址栏同步。
anchor:
  # 滚动文章时将当前标题锚点写入地址栏。
  auto_update: false
  # 点击标题时滚动到该标题并更新锚点。
  click_to_scroll: true

# 复制功能及达到指定字数后附加的署名。
copy:
  enable: true
  copyright:
    enable: false
    # 选中文本超过此字符数时追加署名；TeX 复制处理后的文本也参与计数。
    limit_count: 150

# 文章内容许可，独立于主题代码的 Apache-2.0 许可。
post_copyright:
  enable: true
  # 解码版权区中的文章链接，改善中文路径显示。
  decode: false
  # 版权区作者名称的链接地址。
  author_href: null
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 在线编辑地址前缀，如 https://github.com/用户/仓库/edit/main/source/。
post_edit:
  enable: false
  url: null

# 赞赏文案和二维码列表；每项可含 img、link、text。
reward:
  enable: false
  text: null
  QR_code:
    # - img: /img/reward.png
    #   link: /img/reward.png
    #   text: 赞赏二维码

related_post:
  enable: false
  # 相关文章数量上限。
  limit: 6
  # 相关文章显示 created 或 updated 日期。
  date_type: created

# 1 下一篇指向旧文章，2 指向新文章，false 关闭。
post_pagination: false

noticeOutdate:
  enable: false
  # 提示外观：flat / simple。
  style: flat
  # 超过此天数后显示文章过期提示。
  limit_day: 365
  # 提示位置：top / bottom。
  position: top
  message_prev: 此文章最后更新于
  message_next: 天前，文章的内容可能已过时。

# 字数与阅读时间统计，需要站点安装 hexo-wordcount。
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 内容渲染
# ────────────────────────────────

markdown:
  # auto 保留已安装的渲染器；theme 使用内置渲染器；external 使用站点渲染器。
  renderer: theme

code_blocks:
  # 代码配色：darker / pale night / light / ocean / false。
  theme: light
  macStyle: true
  # 代码块高度上限，单位：px；false 不限制。
  height_limit: 200
  word_wrap: false
  copy: true
  language: true
  # true 折叠，false 展开，none 展开并隐藏折叠按钮。
  shrink: false
  fullpage: true

math:
  # 默认公式引擎：katex / mathjax；留空关闭。
  use: katex
  # true 应用于所有页面；false 由文章 math 字段选择。
  per_page: true
  hide_scrollbar: true
  mathjax:
    # server 构建 SVG；client 在浏览器渲染。
    render: server
    # 启用化学公式扩展。
    mhchem: false
    # 客户端渲染模式的右键菜单开关。
    enableMenu: true
    # 公式编号：all / ams / none。
    tags: none
    # 客户端模式的扩展加载配置。
    loader: {}
    # 客户端模式的输出参数。
    output: {}
    # TeX 参数；两种渲染模式均可使用，例如 macros。
    tex: {}
    # 客户端 CHTML 参数，构建时 SVG 模式不使用此项。
    chtml:
      scale: 1.1
    # 客户端文档处理参数。
    options:
      lazyMargin: 200px
  katex:
    # 启用构建时化学公式。
    mhchem: true
    # 传给 KaTeX 的构建参数，例如 macros、strict。
    options: {}
    # 复制公式时保留 TeX 源码。
    copy_tex: true

beautify:
  enable: true
  # 文章美化范围：post / site。
  field: site
  # 标题前缀图标的 Font Awesome Unicode 编码。
  title_prefix_icon: \f101
  title_prefix_icon_color: null

series:
  enable: false
  # 系列排序字段：title / date。
  orderBy: title
  # 1 升序，-1 降序。
  order: 1
  number: true

note:
  # 提示块样式：simple / modern / flat / disabled。
  style: flat
  icons: true
  border_radius: 3
  # 背景亮度偏移百分比，同时作用于 label 标签。
  light_bg_offset: 0

abcjs:
  enable: false
  # true 为文章和独立页面注入乐谱初始化；false 时由页面 abcjs: true 开启。
  per_page: true

mermaid:
  enable: true
  # 适配输出为 pre > code.mermaid 的围栏；内置渲染建议使用 mermaid 标签。
  code_write: false
  # 浅色和深色模式的图表主题。
  theme:
    light: default
    dark: dark
  # 显示在新标签页查看图表的按钮。
  open_in_new_tab: true
  # 启用图表缩放与拖动。
  zoom_pan: true
  # 全局参数；单张图表和当前配色主题优先。
  options: {}

echarts:
  enable: true
  # 图表默认高度，单位：px。
  height: 400
  # 初始化参数，可设置 renderer、locale、devicePixelRatio。
  init_options:
    renderer: canvas
  theme:
    light: null
    dark: dark
  # 默认 ECharts option；与单图 JSON 按顶层键合并，单图同名键优先。
  option:
    animation: false

chartjs:
  enable: true
  # 全局参数，单张图表的定义优先。
  options: {}
  # 图表默认文字颜色，分别配置浅色和深色模式。
  fontColor:
    light: rgba(0, 0, 0, 0.8)
    dark: rgba(255, 255, 255, 0.8)
  # 图表默认边框颜色。
  borderColor:
    light: rgba(0, 0, 0, 0.1)
    dark: rgba(255, 255, 255, 0.2)
  # 雷达图和极坐标图刻度文字的背景色。
  scale_ticks_backdropColor:
    light: transparent
    dark: transparent

# 搜索与评论
# ────────────────────────────────

search:
  # 搜索服务：local_search / algolia_search / docsearch；留空关闭。
  use: local_search
  placeholder: 搜索...
  algolia_search:
    # Algolia 每页结果数量。
    hitsPerPage: 6
  local_search:
    # 页面加载后提前下载索引。
    preload: false
    # 每篇文章的命中摘要数，-1 显示全部。
    top_n_per_article: 1
    pagination:
      enable: false
      # 本地搜索启用分页后的每页结果数量。
      hitsPerPage: 8
    # 自定义索引地址；留空使用站点生成的 search.path。
    CDN: null
  docsearch:
    # DocSearch 应用 ID。
    appId: null
    # 公开的搜索专用 API Key。
    apiKey: null
    # 索引名、索引名数组或包含 name、searchParameters 的对象数组。
    indices:
      # - my-index
    option: null

comments:
  # 最多选择两个：Artalk、Twikoo、Waline；第一个默认显示。
  use:
    # - Waline
  # 在双评论系统切换按钮旁显示服务名称。
  text: true
  # 评论区域进入视口时加载；文章头部计数需要提前加载。
  lazyload: false
  # 在文章页元信息中显示评论数量。
  count: false
  # 在首页文章卡片显示评论数量。
  card_post_count: false

artalk:
  # Artalk 服务地址，需部署服务端。
  server: null
  # Artalk 中登记的站点名称。
  site: null
  visitor: false
  # 文章投票；评论投票使用 option.vote。
  vote: false
  option: null

twikoo:
  # Twikoo 环境 ID 或部署地址，按所用部署方式填写。
  envId: null
  # Twikoo 环境区域，可按服务端部署要求设置。
  region: null
  visitor: false
  option: null

waline:
  # Waline 服务端地址。
  serverURL: null
  # 评论区背景图片地址。
  bg: null
  # 使用 Waline 提供当前文章的阅读量。
  pageview: false
  option: null

# 统计与搜索引擎
# ────────────────────────────────

# 默认使用 Vercount；UV 为独立访客，PV 为浏览次数。
visitor_counter:
  site_uv: false
  site_pv: false
  page_pv: false
  api_url: https://events.vercount.one/api/v2/log
  # 请求超时，单位：毫秒。
  timeout: 5000
  # 默认 ID 分别为 vercount_value_site_uv、vercount_value_site_pv、vercount_value_page_pv。
  element_id:
    site_uv: null
    site_pv: null
    page_pv: null
  # 追加到各计数节点的自定义 CSS 类名。
  element_class:
    site_uv: null
    site_pv: null
    page_pv: null

# 验证标签列表，每项包含 name 与 content。
site_verification:
  # - name: google-site-verification
  #   content: 填写服务提供的验证码

# Open Graph 元信息，option 传给 Hexo open_graph。
Open_Graph_meta:
  enable: true
  option:
    # twitter_image: /img/share.jpg
    # twitter_site: '@your_account'
    # fb_admins:
    # fb_app_id:
    twitter_card: summary_large_image
    twitter_id: "@LynxCatTheThird"

structured_data:
  enable: true
  # 站点别名数组，用于结构化数据。
  alternate_name:
    # - 我的博客

# 动效与加载
# ────────────────────────────────

preloader:
  enable: false
  # 加载提示：1 全屏动画，2 Pace 进度条。
  source: 1
  # Pace 自定义样式表地址。
  pace_css_url: null

# 页面进入动画；系统减少动态效果偏好优先。
enter_transitions: true

# 输入时的粒子与抖动效果。
activate_power_mode:
  enable: false
  colorful: true
  shake: true
  mobile: false

# 静态背景彩带。
canvas_ribbon:
  enable: false
  size: 150
  # 彩带不透明度，范围：0–1。
  alpha: 0.6
  zIndex: -1
  click_to_change: false
  mobile: false

# 动态飘带。
canvas_fluttering_ribbon:
  enable: false
  mobile: false

# 粒子连线背景。
canvas_nest:
  enable: false
  # 线条 RGB 值，用逗号分隔，如 0,0,255。
  color: 0,0,255
  # 线条不透明度，范围：0–1。
  opacity: 0.7
  zIndex: -1
  # 背景粒子数量。
  count: 99
  mobile: false

# 点击烟花效果。
fireworks:
  enable: false
  zIndex: 9999
  mobile: false

# 点击爱心效果。
click_heart:
  enable: false
  mobile: false

# 点击时显示自定义文字。
clickShowText:
  enable: false
  # 待显示文字的数组，如 [欢迎, 阅读]。
  text:
    # - 欢迎
    # - 阅读
  # 文字大小，单位：px。
  fontSize: 15px
  # 随机选择文字；false 按数组顺序显示。
  random: false
  mobile: false

# 导航与资源
# ────────────────────────────────

# Swup 导航、页面缓存与预加载。
navigation:
  enable: true
  # 缓存已获取的 HTML；预加载同时依赖此开关。
  cache: true
  # cache 为 true 时，在悬停、触摸或键盘聚焦链接时预加载。
  preload: true
  # 页面和脚本加载超时，单位：毫秒。
  timeout: 10000
  # 精确匹配 pathname，子路径部署需含 root，如 /blog/policy/；查询参数与片段不参与比较。
  exclude:
    # - /policy/

CDN:
  # 资源分为主题代码和第三方组件，分别选择来源。
  # 主题内部代码：local / custom。
  internal_provider: local
  # 第三方资源：local / jsdelivr / unpkg / cdnjs / npmmirror / zstatic / custom。
  third_party_provider: npmmirror
  # 控制 local/jsdelivr/unpkg 的版本标记；cdnjs/npmmirror/zstatic 主地址固定包含版本。
  version: false
  # npmmirror 和 zstatic 已内置地址规则，直接选择 provider 即可。
  # 自定义 CDN URL 模板；对应 provider 设为 custom 时使用。
  # 占位符：name、version、file、min_file、cdnjs_name、cdnjs_file、min_cdnjs_file。
  # 示例：https://registry.npmmirror.com/${name}/${version}/files/${file}
  # 示例：https://s4.zstatic.net/ajax/libs/${cdnjs_name}/${version}/${min_cdnjs_file}
  custom_format: https://registry.npmmirror.com/${name}/${version}/files/${file}
  # 主题代码使用自建 CDN 时，将 internal_provider 设为 custom 并填写独立模板。
  # internal_custom_format: https://cdn.example.com/dragonfly/${version}/${file}
  # 本地调试可启用开发模式，内部资源将使用本地构建。
  # development: false
  # 单项 URL 覆盖：移除配置行的“# ”并保留缩进，地址填写在冒号后。
  # 分组空行不影响解析；地址保持单行，空值继续沿用 provider。
  # 开发模式忽略内部资源覆盖；第三方组件仍按这里的地址加载。
  option:
    # 主题内部脚本与样式
    # main:
    # utils:
    # navigation:
    # local_search:
    # algolia_js:
    # echarts_runtime:
    # main_css:

    # 导航依赖
    swup: "https://s4.zstatic.net/ajax/libs/swup/4.10.0/Swup.umd.min.js"
    # swup_head:
    # swup_preload:
    # swup_a11y:
    # swup_scripts:

    # 搜索与评论
    # algolia_search:
    # docsearch_js:
    # docsearch_css:
    # artalk_js:
    # artalk_css:
    # twikoo:
    # waline_js:
    # waline_css:

    # 公式、图表与乐谱
    # katex:
    # mathjax:
    # echarts:
    # chartjs:
    # mermaid:
    # abcjs_basic_js:

    # 图片、字体与代码高亮
    # fancybox:
    # fancybox_css:
    # medium_zoom:
    # lazyload:
    # egjs_infinitegrid:
    # fontawesome:
    # prismjs_js:
    # prismjs_autoloader:
    # prismjs_lineNumber_js:

    # 装饰与加载效果
    # typed:
    # activate_power_mode:
    # canvas_ribbon:
    # canvas_fluttering_ribbon:
    # canvas_nest:
    # fireworks:
    # click_heart:
    # clickShowText:
    # pace_js:
    # pace_default_css:

# 通过 Stylus 添加浏览器样式前缀。
css_prefix: true

# 应用与扩展
# ────────────────────────────────

# 配合站点的离线插件提供 manifest 与图标。
pwa:
  enable: false
  # 站点 manifest 地址；离线缓存与 Service Worker 由站点插件生成。
  manifest: null
  apple_touch_icon: null
  favicon_32_32: null
  favicon_16_16: null
  mask_icon: null

# head 在 </head> 前注入，bottom 在 </body> 前注入。
inject:
  head:
    - <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    - <link rel="stylesheet" href="/css/custom.css">
    - >-
      <link rel="stylesheet"
      href="https://registry.npmmirror.com/@fontsource/jetbrains-mono/5.3.0/files/latin-400.css">
  bottom:
    # - '<script src="/js/custom-widget.js"></script>'
